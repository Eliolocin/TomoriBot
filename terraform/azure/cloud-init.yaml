#cloud-config
# Rendered through Terraform's templatefile() (see vm.tf), which consumes dollar-brace as
# interpolation and percent-brace as a directive before cloud-init ever sees them. This
# comment therefore spells both out rather than quoting them, since quoting them here
# would fail the same way. Shell written in this file must avoid both: prefer a bare
# "$VAR" to a braced one, and a command's exit status to a printf-style percent-brace
# format. Percent-brace fails at parse time and names itself in the error, while
# dollar-brace fails later as an unknown variable, so the two are never reported together
# and fixing one can surface the other.
package_update: true
package_upgrade: true

write_files:
  - path: /usr/local/sbin/tomoribot-setup-swap.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if ! grep -qE '^/swapfile\s+' /etc/fstab; then
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      if [ ! -f /swapfile ]; then
        fallocate -l 3G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=3072
        chmod 600 /swapfile
        mkswap /swapfile
      fi

      if ! swapon --show=NAME --noheadings | grep -qx '/swapfile'; then
        swapon /swapfile
      fi
  - path: /usr/local/sbin/tomoribot-setup-zram.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # The Azure kernel ships a minimal module set; zram.ko lives in modules-extra.
      # Two packages, deliberately, and the order carries the risk. The versioned name
      # must match the running kernel or the modprobe below fails: package_upgrade runs
      # before this script, so the archive often already offers a kernel newer than the
      # booted one, and the meta-package would resolve modules-extra against that newer
      # kernel instead. The meta-package tracks linux-image-azure and is the only thing
      # that carries zram.ko across a later unattended kernel upgrade, so it is installed
      # best-effort: a versioned name alone leaves the host with no zram device after the
      # next kernel reboot, and swap then falls back to disk silently.
      apt-get install -y "linux-modules-extra-$(uname -r)" systemd-zram-generator
      apt-get install -y linux-modules-extra-azure || true

      modprobe zram
      echo zram > /etc/modules-load.d/zram.conf

      systemctl daemon-reload
      systemctl start "systemd-zram-setup@zram0.service"
  - path: /etc/systemd/zram-generator.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Compressed swap in RAM. This VM is memory-starved and CPU-idle (2 vCPU at ~5%
      # load), so trading a little CPU for capacity is the favourable direction. zstd
      # measures ~4:1 on the bot's heap, so this device holds roughly its full size in
      # pages for about a quarter of that in real RAM.
      #
      # Priority outranks /swapfile, which stays as the overflow tier beneath it: a
      # disk-backed fallback must exist, because a full zram device has nowhere to spill.
      [zram0]
      zram-size = 1024
      compression-algorithm = zstd
      swap-priority = 100
  - path: /etc/sysctl.d/99-tomoribot-swap.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Tuned for zram, not for the disk swapfile. Swapping to compressed RAM costs
      # microseconds, so the kernel should prefer it over reclaiming page cache; the
      # previous value of 20 was avoiding disk seeks that no longer dominate. Readahead
      # has no value without seeks, hence page-cluster 0.
      #
      # Do not lower swappiness to "preserve swap headroom". zram measures 3.87:1
      # effective here, holding 688 MiB of anonymous pages in 178 MiB of RAM, against a
      # 908 MiB anonymous working set on an 843 MiB host. Pages migrated back out of
      # zram expand at that ratio, so a lower value costs more RAM than it frees.
      vm.swappiness=180
      vm.page-cluster=0
      # The default 10 leaves kswapd under 1 MiB of runway at this memory size, so
      # allocations enter synchronous direct reclaim almost immediately: 9,911
      # allocstalls in 7.7 h of uptime. A wider gap lets kswapd reclaim ahead of demand
      # instead, at the cost of holding roughly 8 MiB further from allocation.
      vm.watermark_scale_factor=100
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true,
        "no-new-privileges": true
      }
  - path: /usr/local/sbin/tomoribot-scheduled-restart.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # The bot's anonymous working set grows steadily without plateauing, so it sinks
      # progressively into swap while resident memory stays flat. Once swap depth is large
      # enough, major-fault stalls hold handlers long enough that Bun's SQL pool retires
      # their queries on its idle timeout, and every database-touching handler starts
      # failing together. The gateway heartbeat is independent of handlers, so the bot goes
      # on reporting healthy while this happens and nothing restarts it. Recycling on a
      # timer bounds the swap depth. This treats the symptom, not the accumulation.
      #
      # The bot is not the only tenant that grows, and it is the only one anything restarts.
      # searxng and the Azure Monitor agent ride the host's whole uptime, and both climb the
      # same way: measured on this host, searxng went 22MB to 95MB and the agent stack 148MB
      # to 200MB between a fresh boot and 13 hours. Together they are comparable to the gap
      # between the compressed swap device's capacity and total demand, and once that device
      # saturates every further page falls through to disk at roughly a hundred times the
      # fault cost. Recycling them here is what keeps zram below its ceiling.
      #
      # searxng cannot bound itself: its Granian worker respawns on an RSS ceiling, but RSS
      # reads near zero once the worker is swapped out, so the guard is anti-correlated with
      # the pressure it exists to catch.

      # Co-tenant failures must not block the bot's own restart, which is the one that
      # matters, but they must not pass silently either: a monitoring agent that quietly
      # stopped shipping is a failure mode this deployment has already hit once.
      DEGRADED=0

      host_swap_mb() { free -m | awk '/^Swap:/ { print $3 }'; }

      echo "host_swap_before=$(host_swap_mb)MB"

      # Recycled before the bot so its cold start, which is the most allocation-heavy moment
      # in the cycle, runs with the reclaimed headroom already available.
      SEARX_CID="$(docker ps -q --filter 'label=com.docker.compose.service=searxng' | head -1)"
      if [ -n "$SEARX_CID" ]; then
        if docker restart -t 15 "$SEARX_CID" > /dev/null; then
          echo "recycled searxng"
        else
          echo "WARNING: failed to recycle searxng"
          DEGRADED=1
        fi
      else
        echo "searxng not running; skipping"
      fi

      # The host JSONL is the source of truth and the agent is only the shipping layer, so a
      # brief gap here costs nothing that cannot be read back off the host.
      if systemctl is-active --quiet azuremonitoragent; then
        if systemctl restart azuremonitoragent; then
          echo "recycled azuremonitoragent"
        else
          echo "WARNING: failed to recycle azuremonitoragent"
          DEGRADED=1
        fi
      else
        echo "azuremonitoragent not active; skipping"
      fi

      # Resolve through the compose label instead of the generated container name, which
      # would silently stop matching if the compose project were ever renamed.
      CID="$(docker ps -q --filter 'label=com.docker.compose.service=tomoribot' | head -1)"
      if [ -z "$CID" ]; then
        echo "no running tomoribot container; co-tenants recycled, nothing else to do"
        echo "host_swap_after=$(host_swap_mb)MB"
        exit "$DEGRADED"
      fi
      CID="$(docker inspect -f '{{.Id}}' "$CID")"

      swap_mb() {
        local f="/sys/fs/cgroup/system.slice/docker-$1.scope/memory.swap.current"
        if [ -r "$f" ]; then echo $(( $(cat "$f") / 1048576 )); else echo "?"; fi
      }

      # A deploy recreates the container, which already resets the swap depth this exists to
      # bound. Restarting a young container spends an outage and buys nothing. The co-tenants
      # above are recycled regardless, since their growth tracks host uptime rather than this
      # container's age.
      STARTED="$(docker inspect -f '{{.State.StartedAt}}' "$CID")"
      AGE=$(( $(date +%s) - $(date -d "$STARTED" +%s) ))
      if [ "$AGE" -lt 21600 ]; then
        echo "container is $AGE seconds old (under 6h); skipping bot restart"
        echo "host_swap_after=$(host_swap_mb)MB"
        exit "$DEGRADED"
      fi

      T0=$(date +%s)
      echo "restarting: age=$AGE seconds cg_swap=$(swap_mb "$CID")MB"

      # Docker's 10s default stop grace is short enough to SIGKILL the bot partway through
      # its own shutdown.
      docker restart -t 30 "$CID"

      for _ in $(seq 1 30); do
        # Exit status rather than a written-out status code: curl's --write-out uses a
        # percent-brace syntax that Terraform's templatefile() parses as a directive.
        if curl -sf -o /dev/null --max-time 5 http://127.0.0.1:8081/healthz; then
          echo "healthy after $(( $(date +%s) - T0 ))s, cg_swap=$(swap_mb "$CID")MB"
          echo "host_swap_after=$(host_swap_mb)MB"
          exit "$DEGRADED"
        fi
        sleep 3
      done

      # Exiting non-zero leaves the unit visibly failed, since an unattended restart that
      # never came back must not look identical to a successful one.
      echo "ERROR: not healthy within 90s of restart"
      echo "host_swap_after=$(host_swap_mb)MB"
      exit 1
  - path: /etc/systemd/system/tomoribot-restart.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=TomoriBot scheduled recycle of the container and its co-tenants
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/tomoribot-scheduled-restart.sh
      # Must exceed the co-tenant recycles plus the bot's 30s stop grace and 90s health wait.
      TimeoutStartSec=300
  - path: /etc/systemd/system/tomoribot-restart.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Recycle TomoriBot daily at its lowest-traffic hour

      [Timer]
      # Set to the lowest-traffic hour in this deployment's activity histogram, so the
      # brief outage lands where it interrupts the fewest turns. Derive it from your own
      # traffic before reusing this value. The explicit UTC suffix keeps the schedule
      # correct if the host timezone is ever changed away from Etc/UTC.
      OnCalendar=*-*-* 00:00:00 UTC
      AccuracySec=1min
      # A missed run must not fire at boot: booting already produced a fresh container,
      # so catching up would restart a process that has nothing accumulated yet.
      Persistent=false

      [Install]
      WantedBy=timers.target

  - path: /etc/tomoribot/watchdog.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Progress watchdog configuration. Sourced by tomoribot-progress-watchdog.sh, which sets
      # these defaults itself first, so an absent or partial file is safe.
      #
      # ARMED=false means the watchdog evaluates and logs but never recycles anything. Leave it
      # false until the staleness threshold below has a baseline: nothing has ever calibrated it,
      # and a watchdog acting on an uncalibrated threshold is a restart-loop generator.
      WATCHDOG_ARMED=false
      # Event-loop staleness that counts as a stalled check. The monitor ticks once a second, so
      # healthy staleness is a few hundred ms; 30s is far above noise and deliberately loose.
      WATCHDOG_STALENESS_LIMIT_MS=30000
      # Consecutive stalled checks required before acting. The timer runs every minute, so five
      # means roughly five minutes of continuous failure. One bad check is never enough: that is
      # how a naive threshold has already taken this host down once.
      WATCHDOG_REQUIRED_FAILURES=5
      # No action within this many seconds of container start, so a cold start cannot be read as
      # a stall. The startup working set is reached within about ten minutes.
      WATCHDOG_STARTUP_GRACE_SEC=900
      # Minimum seconds between recycles, so a container that comes back still broken cannot be
      # restarted in a loop.
      WATCHDOG_MIN_ACTION_INTERVAL_SEC=3600
  - path: /usr/local/sbin/tomoribot-progress-watchdog.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -uo pipefail

      # Docker restarts a container that exits and leaves a merely unhealthy one alone, so the
      # failure this covers is the one where the process is alive and reporting healthy while
      # making no progress. That is not hypothetical: a heap snapshot once left the main thread
      # pinned for 15.5 hours while Discord stayed connected and /healthz kept answering 200, and
      # nothing recorded it. Readiness and websocket ping are both blind to it, which is why the
      # bot publishes event-loop staleness separately.
      #
      # Two shapes count as no progress and they look different on the wire. A starved loop still
      # answers /healthz, with an inflated stalenessMs. A fully blocked one cannot answer at all,
      # because the health server shares that loop, so the probe times out instead. Treating only
      # the first would miss the worse case.
      #
      # This runs on the host rather than in the bot deliberately: an in-process detector stops
      # running during exactly the starvation it exists to detect.

      # Defaults precede the config file so a missing or partial file cannot leave a variable
      # unset under set -u, and so no brace-default syntax is needed. Terraform renders this file
      # through templatefile(), which reads dollar-brace and percent-brace as directives.
      WATCHDOG_ARMED=false
      WATCHDOG_STALENESS_LIMIT_MS=30000
      WATCHDOG_REQUIRED_FAILURES=5
      WATCHDOG_STARTUP_GRACE_SEC=900
      WATCHDOG_MIN_ACTION_INTERVAL_SEC=3600

      CONF=/etc/tomoribot/watchdog.conf
      if [ -r "$CONF" ]; then . "$CONF"; fi

      # State lives on tmpfs so a reboot clears it, which is correct: booting already produced a
      # fresh container, and an accumulated failure count describes a process that is gone.
      STATE=/run/tomoribot-watchdog.state
      FAILURES=0
      LAST_ACTION_AT=0
      if [ -r "$STATE" ]; then . "$STATE"; fi

      save_state() {
        printf 'FAILURES=%s\nLAST_ACTION_AT=%s\n' "$FAILURES" "$LAST_ACTION_AT" > "$STATE"
      }

      NOW=$(date +%s)

      BODY=$(curl -sf --max-time 5 http://127.0.0.1:8081/healthz 2>/dev/null)
      PROBE_RC=$?
      REASON=""

      if [ "$PROBE_RC" -ne 0 ]; then
        REASON="probe failed rc=$PROBE_RC"
        STALLED=1
      else
        # sed rather than jq, which is not installed on this host.
        STALENESS=$(printf '%s' "$BODY" | sed -n 's/.*"stalenessMs":\([0-9]*\).*/\1/p' | head -1)
        if [ -z "$STALENESS" ]; then
          # A build with no eventLoop field is not a stall and must not be treated as one.
          echo "no stalenessMs in /healthz body; this build predates the event-loop monitor, skipping"
          FAILURES=0
          save_state
          exit 0
        fi
        if [ "$STALENESS" -ge "$WATCHDOG_STALENESS_LIMIT_MS" ]; then
          REASON="staleness $STALENESS ms at or above the $WATCHDOG_STALENESS_LIMIT_MS ms limit"
          STALLED=1
        else
          STALLED=0
        fi
      fi

      if [ "$STALLED" -eq 0 ]; then
        if [ "$FAILURES" -gt 0 ]; then echo "progress resumed after $FAILURES failed check(s)"; fi
        FAILURES=0
        save_state
        exit 0
      fi

      FAILURES=$(( FAILURES + 1 ))
      save_state
      echo "no progress: $REASON (consecutive=$FAILURES of $WATCHDOG_REQUIRED_FAILURES)"

      if [ "$FAILURES" -lt "$WATCHDOG_REQUIRED_FAILURES" ]; then exit 0; fi

      CID=$(docker ps -q --filter 'label=com.docker.compose.service=tomoribot' | head -1)
      if [ -z "$CID" ]; then
        echo "no running tomoribot container; nothing to recycle"
        exit 0
      fi

      STARTED=$(docker inspect -f '{{.State.StartedAt}}' "$CID")
      AGE=$(( NOW - $(date -d "$STARTED" +%s) ))
      if [ "$AGE" -lt "$WATCHDOG_STARTUP_GRACE_SEC" ]; then
        echo "container is $AGE seconds old, inside the $WATCHDOG_STARTUP_GRACE_SEC second grace; not acting"
        exit 0
      fi

      SINCE_ACTION=$(( NOW - LAST_ACTION_AT ))
      if [ "$LAST_ACTION_AT" -ne 0 ] && [ "$SINCE_ACTION" -lt "$WATCHDOG_MIN_ACTION_INTERVAL_SEC" ]; then
        # Repeating inside the limit means the previous recycle did not fix it, which is a
        # different and worse problem than a single stall, so it is said louder.
        echo "ALERT: still stalled $SINCE_ACTION seconds after the last recycle; rate limit holds, not acting"
        exit 0
      fi

      if [ "$WATCHDOG_ARMED" != "true" ]; then
        echo "OBSERVE-ONLY: would recycle co-tenants then the bot ($REASON, age=$AGE s). Set WATCHDOG_ARMED=true in $CONF to arm."
        # The action time advances even when disarmed, so the rate limit is exercised during the
        # observation period rather than meeting reality for the first time once armed.
        LAST_ACTION_AT=$NOW
        FAILURES=0
        save_state
        exit 0
      fi

      echo "ACTING: $REASON (age=$AGE s)"
      LAST_ACTION_AT=$NOW
      FAILURES=0
      save_state

      # Co-tenants first, matching the daily recycle order: recycling them alone was measured
      # cutting host IO pressure 43%, and it is the cheaper rung. A failure here must not block
      # the bot's own restart, which is the one that matters.
      SEARX_CID=$(docker ps -q --filter 'label=com.docker.compose.service=searxng' | head -1)
      if [ -n "$SEARX_CID" ]; then
        docker restart -t 15 "$SEARX_CID" > /dev/null && echo "recycled searxng" || echo "WARNING: failed to recycle searxng"
      fi

      # Matches the scheduled recycle's grace: Docker's 10s default is short enough to SIGKILL
      # the bot partway through its own shutdown.
      docker restart -t 30 "$CID"

      for _ in $(seq 1 30); do
        if curl -sf -o /dev/null --max-time 5 http://127.0.0.1:8081/healthz; then
          echo "healthy again after $(( $(date +%s) - NOW )) seconds"
          exit 0
        fi
        sleep 3
      done

      # Exiting non-zero leaves the unit visibly failed, since a recycle that never came back
      # must not look identical to a successful one.
      echo "ERROR: not healthy within 90s of the watchdog recycle"
      exit 1
  - path: /etc/systemd/system/tomoribot-watchdog.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=TomoriBot event-loop progress watchdog
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/tomoribot-progress-watchdog.sh
      # Must exceed the co-tenant recycle plus the bot's 30s stop grace and 90s health wait.
      TimeoutStartSec=180
  - path: /etc/systemd/system/tomoribot-watchdog.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Check TomoriBot event-loop progress every minute

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=1min
      AccuracySec=10s
      # A missed run must not fire at boot: the boot itself produced a fresh container.
      Persistent=false

      [Install]
      WantedBy=timers.target

  - path: /etc/logrotate.d/tomoribot-observer
    owner: root:root
    permissions: "0644"
    content: |
      # The observer samples every 15s and grew ~1.4 MB/day uncapped, on the OS disk of a host
      # whose whole failure mode is resource exhaustion.
      #
      # Retention is 14 days rather than the usual few, because
      # scripts/devtools/replayPressureDetector.ts reads this file to tune detector thresholds
      # against real incidents. At roughly one incident per five days, a shorter window can leave
      # the replay with no incident to replay.
      /var/log/oom-observer.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          # Yesterday stays uncompressed so incident triage can grep it without a decompress step.
          delaycompress
          # Without this logrotate refuses the file outright, because /var/log is group-writable by
          # `syslog` and it will not rotate inside a directory it considers insecure. The sibling
          # config for the bot's own JSONL needs no `su`: that file sits in a 0750 directory.
          su root syslog
          # The observer redirects per sample rather than holding the file open, so it picks up the
          # new inode on its next write. copytruncate would only add a lost-write race here.
          create 0644 root root
      }

  - path: /etc/logrotate.d/tomoribot-jsonl
    owner: root:root
    permissions: "0644"
    content: |
      # The durable witness the runbook greps during an incident, and the only error record that
      # survives when the database is unreachable. It reached 57 MB unrotated.
      #
      # A cascade day writes far more than a quiet one (one episode added ~0.5 MB in two hours
      # against a ~1.6 MB/day baseline), so maxsize caps a bad day without waiting for midnight.
      /var/log/tomoribot/tomoribot.jsonl {
          daily
          rotate 14
          maxsize 100M
          missingok
          notifempty
          compress
          delaycompress
          # Required, not preferred: pino holds this file open through
          # `pino.destination({ append: true, sync: true })` and does not reopen on a signal, so
          # renaming it would leave the bot writing to an unlinked inode until the next restart.
          copytruncate
      }
runcmd:
  - mkdir -p /etc/tomoribot
  - chmod 0700 /etc/tomoribot
  - /usr/local/sbin/tomoribot-setup-swap.sh
  - sysctl --system
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /tmp/docker.asc
  - gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin jq ufw
  - systemctl enable --now docker
  # After apt is primed, since this one needs packages unlike the swapfile script above.
  - /usr/local/sbin/tomoribot-setup-zram.sh
  - sysctl --system
  - systemctl daemon-reload
  - systemctl enable --now tomoribot-restart.timer
  # Safe to enable on a fresh host: the watchdog ships disarmed and only logs what it would do.
  - systemctl enable --now tomoribot-watchdog.timer
